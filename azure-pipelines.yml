trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: Docker@2
  displayName: 'Build Docker Image'
  inputs:
    containerRegistry: 'Connection to Container'
    repository: 'demo-container'
    command: 'build'
    Dockerfile: '**/Dockerfile'

- task: Docker@2
  displayName: 'Push Docker Image'
  inputs:
    containerRegistry: 'Connection to Container'
    repository: 'demo-container'
    command: 'push'